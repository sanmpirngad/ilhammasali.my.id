<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#grad2)"/>
  <circle cx="680" cy="80" r="140" fill="#f97316" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="120" cy="420" r="180" fill="#c2410c" opacity="0.1" filter="url(#glow2)"/>

  <!-- Browser window chrome -->
  <rect x="50" y="50" width="700" height="400" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
  <rect x="50" y="50" width="700" height="42" rx="12" fill="#202024"/>
  <rect x="50" y="80" width="700" height="12" fill="#202024"/>

  <!-- Window controls -->
  <circle cx="78" cy="71" r="5" fill="#ef4444"/>
  <circle cx="96" cy="71" r="5" fill="#f59e0b"/>
  <circle cx="114" cy="71" r="5" fill="#10b981"/>

  <!-- URL bar -->
  <rect x="140" y="62" width="280" height="18" rx="5" fill="#121215"/>
  <text x="152" y="75" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">https://project02.ilham.dev</text>

  <!-- Content inner mockup -->
  <rect x="85" y="125" width="110" height="24" rx="12" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/>
  <text x="97" y="141" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">PostgreSQL • Vue.js</text>

  <text x="85" y="200" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">Digital Menu & QR POS</text>
  <text x="85" y="235" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Web App & Database — Engineered by Mohammad Ilham</text>

  <!-- Abstract UI blocks -->
  <rect x="85" y="270" width="280" height="130" rx="8" fill="#242429" stroke="#2f2f36" stroke-width="1"/>
  <rect x="105" y="295" width="120" height="10" rx="5" fill="#52525b"/>
  <rect x="105" y="318" width="220" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="105" y="333" width="180" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="105" y="358" width="90" height="26" rx="6" fill="#f97316"/>
  <text x="123" y="375" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">Launch ↗</text>

  <rect x="385" y="270" width="290" height="130" rx="8" fill="#1c1c20" stroke="#2a2a30" stroke-width="1"/>
  <rect x="405" y="295" width="250" height="12" rx="3" fill="#27272a"/>
  <rect x="405" y="318" width="200" height="8" rx="2" fill="#27272a"/>
  <rect x="405" y="335" width="230" height="8" rx="2" fill="#27272a"/>
  <rect x="405" y="352" width="170" height="8" rx="2" fill="#27272a"/>
  <rect x="405" y="369" width="210" height="8" rx="2" fill="#27272a"/>
</svg>